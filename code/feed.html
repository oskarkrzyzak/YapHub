<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YapHub - Feed</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="feed-page">
  <header class="feed-header">
    <div class="header-content">
      <div class="header-left">
        <img src="images/logo.png" alt="YapHub Logo" class="header-logo">
      </div>

      <div class="header-center">
        <h1 class="header-title">YapHub</h1>
      </div>

      <div class="header-right">
        <div class="header-profile">
          <a href="myprofile.html" class="profile-avatar-link">
            <div class="profile-avatar"></div>
          </a>
          <span class="header-nickname" id="headerNickname">myNickname</span>
        </div>
      </div>
    </div>
  </header>

  <div class="feed-layout">
    <aside class="feed-sidebar-left">
      <div class="nav-links">
        <a href="feed.html" class="nav-link active">Home</a>
        <a href="following.html" class="nav-link">Following</a>
        <a href="trending.html" class="nav-link">Trending</a>
        <a href="myprofile.html" class="nav-link">Profile</a>
        <a href="settings.html" class="nav-link">Settings</a>
      </div>
      <button class="post-btn">Post</button>
    </aside>

    <main class="feed-main">
      <div class="search-container">
        <input type="text" class="search-input" placeholder="Search...">
      </div>

      <div class="feed-content">
        <!-- posts are inserted dynamically by script.js -->
      </div>
    </main>

    <aside class="feed-sidebar-right">
      <div class="right-sidebar-placeholder">
        <p>Future features</p>
      </div>
    </aside>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
